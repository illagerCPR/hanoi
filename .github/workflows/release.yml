name: build-release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            exe: dist/Hanoi.exe
            asset: Hanoi-windows-x64.exe
            extra_flags: --icon assets/icon.ico
          - os: ubuntu-22.04
            exe: dist/Hanoi
            asset: Hanoi-linux-x64
            extra_flags: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install PyInstaller and dependencies
        run: |
          python -m pip install --upgrade pyinstaller
          python -m pip install -r requirements.txt

      - name: Build
        run: pyinstaller --onefile --clean --noconfirm --name Hanoi --collect-all textual --collect-all rich ${{ matrix.extra_flags }} main.py

      - name: Smoke test (CLI)
        shell: bash
        env:
          HANOI_DATA_DIR: ${{ runner.temp }}/hanoi-smoke
        run: |
          printf 'start 5\nbest\nmove 0 2\nhint\nstatus\nquit\n' > smoke-in.txt
          "${{ matrix.exe }}" --cli < smoke-in.txt | tee smoke-out.txt
          grep -q "理论最优步数: 31" smoke-out.txt
          grep -q "建议下一步" smoke-out.txt
          grep -q "步数: 1" smoke-out.txt
          if grep -q "错误:" smoke-out.txt; then
            echo "发现错误输出"
            exit 1
          fi

      - name: Smoke test (TUI selftest)
        shell: bash
        env:
          HANOI_DATA_DIR: ${{ runner.temp }}/hanoi-smoke
          HANOI_TUI_SELFTEST: "1"
        run: |
          "${{ matrix.exe }}" --tui | tee tui-out.txt
          grep -q "SELFTEST OK" tui-out.txt
          if grep -q "SELFTEST FAILED" tui-out.txt; then
            echo "TUI 自检失败"
            exit 1
          fi

      - name: Smoke test (TUI v2 selftest)
        shell: bash
        env:
          HANOI_DATA_DIR: ${{ runner.temp }}/hanoi-smoke
          HANOI_TUI_V2_SELFTEST: "1"
        run: |
          "${{ matrix.exe }}" --tui-v2 | tee tui2-out.txt
          grep -q "SELFTEST OK" tui2-out.txt
          if grep -q "SELFTEST FAILED" tui2-out.txt; then
            echo "TUI v2 自检失败"
            exit 1
          fi

      - name: Rename artifact and compute checksum
        shell: bash
        run: |
          mv "${{ matrix.exe }}" "dist/${{ matrix.asset }}"
          cd dist && sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Verify asset integrity
        run: |
          cat release/*.sha256 > SHA256SUMS.txt
          rm release/*.sha256
          (cd release && sha256sum -c ../SHA256SUMS.txt)

      - name: Compute next version
        run: |
          HEAD_TAG=$(git tag --points-at HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n 1)
          if [ -n "$HEAD_TAG" ]; then
            TAG="$HEAD_TAG"
            echo "使用提交自带 tag: $TAG"
          else
            LATEST=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
            [ -n "$LATEST" ] || LATEST=v1.0.0
            MAJOR=$(printf '%s' "$LATEST" | cut -d. -f1 | tr -d v)
            MINOR=$(printf '%s' "$LATEST" | cut -d. -f2)
            PATCH=$(printf '%s' "$LATEST" | cut -d. -f3)
            TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
            echo "发布版本: ${TAG}（上一个: ${LATEST}）"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          SUBJECT=$(printf '%s' "$COMMIT_MSG" | head -n 1)
          [ -n "$SUBJECT" ] || SUBJECT="手动触发 (workflow_dispatch)"
          TITLE="汉诺塔 ${TAG} — ${SUBJECT}"
          NOTES=$(cat <<EOF
          构建: [${COMMIT_SHA:0:7}](https://github.com/${GITHUB_REPOSITORY}/commit/${COMMIT_SHA})
          提交: ${SUBJECT}

          ## 下载

          - \`Hanoi-windows-x64.exe\` — Windows x64（GUI + CLI + TUI，双击或命令行运行）
          - \`Hanoi-linux-x64\` — Linux x64（运行前 \`chmod +x\`）

          运行模式：\`--gui\` 图形界面（默认）、\`--cli\` 命令行、\`--tui\` 终端界面 v1（零依赖）、\`--tui-v2\` 终端界面 v2（Textual）。

          数据保存在可执行文件同目录的 \`data/\` 下，可通过 \`HANOI_DATA_DIR\` 环境变量覆盖。

          ## 完整性校验

          下载后请比对 \`SHA256SUMS.txt\`：
          - PowerShell: \`Get-FileHash .\\Hanoi-windows-x64.exe -Algorithm SHA256\`
          - Linux: \`sha256sum -c SHA256SUMS.txt\`
          若 Windows 提示文件被阻止，执行 \`Unblock-File .\\Hanoi-windows-x64.exe\`。
          EOF
          )
          gh release create "$TAG" release/* SHA256SUMS.txt --title "$TITLE" --notes "$NOTES" \
            || gh release upload "$TAG" release/* SHA256SUMS.txt --clobber

          # 回读校验：发布到 Release 的资产必须与构建产物逐字节一致
          mkdir -p verify && gh release download "$TAG" -D verify
          (cd verify && sha256sum -c ../SHA256SUMS.txt)
